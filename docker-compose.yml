services:
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: nestjs_migrator
    restart: "no"
    env_file:
      - .env
    environment:
      - DB_HOST_POSTGRES=db
    command: sh -c "pnpm run migration:run:prod"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - global_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # ports:
    #   - "3000:3000"  # descomentar para desarrollo local
    container_name: nestjs_backend
    restart: always
    env_file:
      - .env
    environment:
      # Sobrescribe el .env para usar las redes internas de Docker
      - DB_HOST_POSTGRES=db
      - DB_HOST_REDIS=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - global_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio_server
    restart: always
    ports:
      # Expone MinIO por si necesitas ver sus archivos desde tu localhost
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "on"
    volumes:
      - minio_data:/data
    command: server /data --address ":9000" --console-address ":9001"
    networks:
      - global_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  minio_init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - global_net
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local_server http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb --ignore-existing local_server/images;
      /usr/bin/mc mb --ignore-existing local_server/pdfs-response;
      /usr/bin/mc mb --ignore-existing local_server/pdfs-request;
      /usr/bin/mc mb --ignore-existing local_server/pdfs;
      /usr/bin/mc mb --ignore-existing local_server/images-tickets;
      /usr/bin/mc mb --ignore-existing local_server/avatars;
      /usr/bin/mc mb --ignore-existing local_server/excels;
      /usr/bin/mc mb --ignore-existing local_server/tools-images;
      /usr/bin/mc mb --ignore-existing local_server/it-assets-images;
      /usr/bin/mc mb --ignore-existing local_server/images-consumable;
      exit 0;
      "

  db:
    image: postgres:17
    container_name: soportetecnicodb
    restart: always
    ports:
      # Expone Postgres para ejecutar migraciones locales y probar con pnpm start:dev
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - global_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  redis:
    image: redis:8-alpine
    container_name: redis_server
    restart: always
    ports:
      # Expone Redis para que tu backend local (fuera de Docker) lo encuentre
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - global_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
    - "8081:8081"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - global_net
  db_backup:
    image: prodrigestivill/postgres-backup-local
    container_name: postgres_autobackup
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      # Configuración del respaldo
      - SCHEDULE=@every 24h        
      - BACKUP_KEEP_DAYS=7 
      - BACKUP_KEEP_WEEKS=4           
      - BACKUP_KEEP_MONTHS=6         
      - HEALTHCHECK_PORT=8080         
    volumes:
      - ./backups/postgres:/backups   
    networks:
      - global_net
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  global_net:
    name: ticketing_global_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  minio_data:
  redis_data:
  postgres_data: